<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - 계좌후원 오버레이</title>
<script>try{if(localStorage.getItem('sdo_theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tx:#37352f;--sub:#787774;--bd:#e9e9e7;--sb:#f7f6f3;--ac:#2eaadc;--red:#eb5757;--ok:#4dab9a}
html[data-theme=dark]{color-scheme:dark;--bg:#191919;--tx:#e6e6e4;--sub:#a0a09c;--bd:#363636;--sb:#252525}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--tx);font:14px/1.5 'Noto Sans KR',-apple-system,'Segoe UI',sans-serif}
form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
h1{font-size:26px;font-weight:900;margin:0 0 4px;text-align:center}
.desc{text-align:center;color:var(--sub);font-size:13px;margin-bottom:8px}
label{font-size:12.5px;color:var(--sub);margin-top:4px}
input{font:inherit;color:inherit;width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--sb);font-size:15px;outline:none}
input:focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(46,170,220,.25);background:var(--bg)}
.idrow{display:flex;align-items:center;gap:8px}
.idrow input{flex:1;min-width:0}
.idrow span{color:var(--sub);font-size:13px;white-space:nowrap}
.help{color:var(--sub);font-size:12px}
.msg{font-size:13px;min-height:19px;color:var(--red)}
.msg.ok{color:var(--ok)}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;background:var(--ac);color:#fff;font-weight:500;font-size:15px;padding:11px}
button:hover{background:#2699c7}
button:disabled{opacity:.6;cursor:default}
.alt{text-align:center;font-size:13px;color:var(--sub)}
.alt a{color:var(--ac);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>회원가입</h1>
  <div class="desc">아이디와 비밀번호만 있으면 돼요</div>
  <label for="id">아이디</label>
  <div class="idrow"><input id="id" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="영문 소문자·숫자 3~20자"><span>@noogitv.kro.kr</span></div>
  <div class="help">영문 소문자, 숫자, . _ - 만 쓸 수 있어요.</div>
  <label for="pw">비밀번호</label>
  <input id="pw" name="new-password" type="password" autocomplete="new-password" placeholder="6자 이상">
  <label for="pw2">비밀번호 확인</label>
  <input id="pw2" type="password" autocomplete="new-password" placeholder="비밀번호 다시 입력">
  <div class="msg" id="msg"></div>
  <button id="btn" type="submit" disabled>가입하기</button>
  <div class="alt">이미 계정이 있나요? <a href="donation_overlay_popup.html">로그인</a></div>
</form>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const DEFAULT_CFG={apiKey:"AIzaSyDvxWUsemd0_U5eF_G2GNxWIKQyQMNPZ1U",authDomain:"noogi-48c4a.firebaseapp.com",projectId:"noogi-48c4a",storageBucket:"noogi-48c4a.firebasestorage.app",messagingSenderId:"503202497617",appId:"1:503202497617:web:540bfa3c0b19252360e470"};
const ID_DOMAIN='@noogitv.kro.kr';
const $=s=>document.querySelector(s);
const msg=(m,ok)=>{const e=$('#msg');e.textContent=m||'';e.classList.toggle('ok',!!ok)};

let cfg=DEFAULT_CFG;
try{cfg=JSON.parse(localStorage.getItem('sdo_fb_cfg'))||DEFAULT_CFG}catch(e){}
const auth=getAuth(initializeApp(cfg));
$('#btn').disabled=false;

$('#id').addEventListener('input',e=>{e.target.value=e.target.value.replace(/@.*$/,'').replace(/\s/g,'').toLowerCase()});

function errText(err){
  const c=(err&&err.code)||'';
  if(c.includes('email-already-in-use'))return '이미 사용 중인 아이디예요.';
  if(c.includes('weak-password'))return '비밀번호는 6자 이상이어야 해요.';
  if(c.includes('invalid-email'))return '사용할 수 없는 아이디예요.';
  if(c.includes('operation-not-allowed'))return 'Firebase 콘솔 → Authentication → 로그인 방법에서 “이메일/비밀번호”를 켜주세요.';
  if(c.includes('too-many-requests'))return '시도가 너무 많아요. 잠시 뒤에 다시 해주세요.';
  if(c.includes('network'))return '네트워크 연결을 확인해주세요.';
  return '가입에 실패했어요. '+((err&&err.message)||'');
}

$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const id=$('#id').value.trim().toLowerCase(),pw=$('#pw').value,pw2=$('#pw2').value;
  if(!/^[a-z0-9][a-z0-9._-]{2,19}$/.test(id))return msg('아이디는 영문 소문자·숫자로 3~20자로 써주세요. (. _ - 사용 가능)');
  if(pw.length<6)return msg('비밀번호는 6자 이상이어야 해요.');
  if(pw!==pw2)return msg('비밀번호가 서로 달라요.');
  msg('');$('#btn').disabled=true;
  try{
    await createUserWithEmailAndPassword(auth,id+ID_DOMAIN,pw);
    msg('가입 완료! 관리 페이지로 이동할게요…',true);
    setTimeout(()=>{location.href='donation_overlay_popup.html'},700);
  }catch(err){msg(errText(err));$('#btn').disabled=false}
});
</script>
</body>
</html>
